# @file   .github/workflows/codeql.yml
# @brief  CodeQL code scanning for JavaScript and TypeScript.
#
# Responsibility: static security analysis on every PR to master, on master and weekly, so new
#                 queries also run against unchanged code (seasonal-mini-games
#                 .github/workflows/codeql.yml at 93ed780, unchanged but for this header). A
#                 required check of master's branch protection.
name: CodeQL

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  schedule:
    # Mondays 04:23 UTC.
    - cron: '23 4 * * 1'

# Read-only by default; only the analysis may write its results (audit 2026-11-22).
permissions:
  contents: read

jobs:
  analyze:
    runs-on: ubuntu-latest
    # A time limit (night audit 2026-11-25); the analysis takes about a minute.
    timeout-minutes: 20
    permissions:
      security-events: write
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The job token stays off the disk: no step pushes (audit 2026-11-22).
          persist-credentials: false
      - uses: github/codeql-action/init@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          languages: javascript-typescript
          # TypeScript is analysed from source; no build needed.
          build-mode: none
      - uses: github/codeql-action/analyze@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
