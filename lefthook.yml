# @file   lefthook.yml
# @brief  Git hooks: format, lint and scan the staged files for secrets before each commit.
#
# Responsibility: Mini Games' pre-commit hook (seasonal-mini-games lefthook.yml at 93ed780,
#                 Prettier only), stricter: ESLint and gitleaks on the staged files as well.
#                 Installed by hand (`pnpm exec lefthook install`, CONTRIBUTING.md), because no
#                 install script runs here. Every heavier check runs in `pnpm verify` and CI.
pre-commit:
  commands:
    format:
      # No glob: --ignore-unknown skips what Prettier cannot parse; .prettierignore still applies.
      run: pnpm exec prettier --write --ignore-unknown {staged_files}
      # Re-stage the files Prettier rewrote so the commit contains the formatted version.
      stage_fixed: true
    lint:
      glob: '*.{ts,js,mjs}'
      run: pnpm exec eslint --max-warnings 0 {staged_files}
    gitleaks:
      # The image CI uses, pinned by digest (.github/workflows/ci.yml); Docker must be running.
      # MSYS_NO_PATHCONV keeps Git Bash on Windows from rewriting the container paths.
      env:
        MSYS_NO_PATHCONV: '1'
      run: >-
        docker run --rm -v "{root}:/repo" -w /repo
        ghcr.io/gitleaks/gitleaks:v8.30.1@sha256:c00b6bd0aeb3071cbcb79009cb16a60dd9e0a7c60e2be9ab65d25e6bc8abbb7f
        git --pre-commit --staged --redact --no-banner /repo
