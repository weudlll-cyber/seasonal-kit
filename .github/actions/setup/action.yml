# @file   .github/actions/setup/action.yml
# @brief  Shared job setup: pnpm, Node and a frozen-lockfile install without scripts.
#
# Responsibility: one place for the toolchain setup every Node job repeats; versions come from
#                 package.json "packageManager" and .nvmrc, never from the workflow
#                 (seasonal-mini-games .github/actions/setup/action.yml at 93ed780; the install
#                 here also refuses every install script, pnpm-workspace.yaml).
# Used by:        .github/workflows/ci.yml (jobs verify, showcase)
name: Setup
description: Install pnpm and Node, restore the pnpm store cache and install dependencies.
runs:
  using: composite
  steps:
    # No version input: the action reads "packageManager" from package.json.
    - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
    - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
      with:
        node-version-file: .nvmrc
        cache: pnpm
    - run: pnpm install --frozen-lockfile --ignore-scripts
      shell: bash
