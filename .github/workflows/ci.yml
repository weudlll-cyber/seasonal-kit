# @file   .github/workflows/ci.yml
# @brief  CI: verify (format, lint, typecheck, tests with coverage gates and the contrast check,
#         dist up to date, season colours equal to the website's master), osv-scanner,
#         gitleaks, the docs' links, and the showcase with axe (since v0.7.0).
#
# Responsibility: seasonal-mini-games .github/workflows/ci.yml at 93ed780 cut to a library
#                 (no e2e, no image), stricter: osv-scanner fails on any finding, the committed
#                 dist/ must equal a fresh build, the season colours are compared with the
#                 website (DECISIONS K3), also daily, so a change on the site is noticed while
#                 the kit sits still. Every job is a required check of master's branch
#                 protection, `showcase` since 2026-11-21 (DECISIONS K19, docs/RELEASING.md).
#                 Any red job is a reason not to merge.
# Depends on:     .github/actions/setup, osv-scanner.toml, scripts/season-check.mjs,
#                 playwright.config.ts, showcase/
name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  schedule:
    # Daily 05:17 UTC: the season colour check against the website's master.
    - cron: '17 5 * * *'

# Read-only unless a job asks for more; none does.
permissions:
  contents: read

concurrency:
  # One group per branch and event, so a push and its PR do not cancel each other.
  group: ci-${{ github.event_name }}-${{ github.head_ref || github.ref_name }}
  # Every merge commit on master must get its own finished run.
  cancel-in-progress: ${{ github.ref != 'refs/heads/master' }}

# Scanner images pinned by digest, like the actions by commit SHA (the digests Mini Games uses).
env:
  OSV_SCANNER_IMAGE: ghcr.io/google/osv-scanner:v2.7.0@sha256:4f3b7e2c64b9d38a5febc5a7e4a3dfef1d1362f726dea7a2ef4762b46469fcd0
  GITLEAKS_IMAGE: ghcr.io/gitleaks/gitleaks:v8.30.1@sha256:c00b6bd0aeb3071cbcb79009cb16a60dd9e0a7c60e2be9ab65d25e6bc8abbb7f
  SHELLCHECK_IMAGE: koalaman/shellcheck:v0.10.0@sha256:2097951f02e735b613f4a34de20c40f937a6c8f18ecb170612c88c34517221fb
  LYCHEE_IMAGE: lycheeverse/lychee:0.24.2@sha256:e2d19e57cf6ab037026f20b8e449a1f30d9d7f81eef4194763aab2eab20bd28d

jobs:
  # Every job has a time limit (night audit 2026-11-25): a hung step would otherwise hold a runner
  # for six hours. The limits are several times what each job takes (verify ~1 min).
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The job token stays off the disk: no step pushes (audit 2026-11-22).
          persist-credentials: false
      - uses: ./.github/actions/setup
      # The same script as locally: format check, lint, typecheck, tests with coverage gates.
      - run: pnpm verify
      # Games install dist/ as committed (docs/DELIVERY.md): it must be exactly a fresh build.
      - name: dist/ matches the source
        # dist/ is emptied first: tsc never deletes, so a file whose source is gone would stay
        # and ship unseen (audit 2026-11-22).
        run: |
          rm -rf dist
          pnpm build
          if [ -n "$(git status --porcelain -- dist)" ]; then
            # Shows which compiled file is stale or missing before failing.
            git status --porcelain -- dist
            echo "::error::dist/ differs from a fresh build; run pnpm build and commit dist/"
            exit 1
          fi
      # The website is the single source of the season colours: any difference fails (exit 1),
      # and so does a site that cannot be read (exit 2).
      - name: Season colours equal the website's master
        run: node scripts/season-check.mjs

  osv-scanner:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The job token stays off the disk: no step pushes (audit 2026-11-22).
          persist-credentials: false
      # Exit 0: nothing found; 1: findings (fail, whatever their severity); else a scanner error.
      - run: |
          docker run --rm -v "$PWD:/src" -w /src "$OSV_SCANNER_IMAGE" scan source \
            --config=osv-scanner.toml --lockfile=pnpm-lock.yaml

  gitleaks:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The job token stays off the disk: no step pushes (audit 2026-11-22).
          persist-credentials: false
          # gitleaks scans the full history, not just the last commit.
          fetch-depth: 0
      - run: docker run --rm -v "$PWD:/repo" "$GITLEAKS_IMAGE" git /repo --redact --no-banner --exit-code 1

  docs:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The job token stays off the disk: no step pushes (audit 2026-11-22).
          persist-credentials: false
      # Links between the repository's own files (no network: external sites come and go).
      - name: Markdown link check
        run: |
          docker run --rm -v "$PWD:/src" -w /src "$LYCHEE_IMAGE" --offline --no-progress \
            --exclude-path node_modules '**/*.md'

  ops:
    # The backup scripts (ops/, docs/OPERATIONS.md): shellcheck, then back up a real PostgreSQL,
    # restore into a fresh one and compare (ops/test/backup.test.sh). Not a required check.
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The job token stays off the disk: no step pushes (audit 2026-11-22).
          persist-credentials: false
      - name: shellcheck
        run: docker run --rm -v "$PWD:/mnt" -w /mnt "$SHELLCHECK_IMAGE" -x ops/backup.sh ops/lib/backup-core.sh ops/lib/backup-restore.sh ops/pull-backups.sh ops/test/backup.test.sh
      - name: age
        run: sudo apt-get install -y -q age
      - name: Back up, drill and restore on a real PostgreSQL
        run: bash ops/test/backup.test.sh

  showcase:
    # Every component in 5 viewports × 2 themes: axe finds nothing serious or critical
    # (docs/SHOWCASE.md). The screenshots stay on the runner; nothing is uploaded or committed
    # (DECISIONS K16).
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The job token stays off the disk: no step pushes (audit 2026-11-22).
          persist-credentials: false
      - uses: ./.github/actions/setup
      - name: Playwright browser (Chromium)
        run: pnpm exec playwright install --with-deps chromium
      - run: pnpm showcase:test
