# @file   .github/workflows/release-image-test.yml
# @brief  Proves ./release-image.yml and ops/lib/image.sh for real, on a throw-away tag, and
#         removes the test image afterwards.
#
# Responsibility: a tag `sk-test-image-*` (pushed by hand for a proof, deleted after it) releases
#                 .github/test-image/ into the kit's own registry space as
#                 seasonal-kit-test-image; then `sk_image_verify` must pass the image with this
#                 run's identity and refuse it with the default one (a test tag is no release),
#                 for another repository or source commit, and refuse an unsigned image, all with
#                 the cosign `sk_cosign_install` installs by its checksum; the SBOM's attestation
#                 verifies. Last, whatever happened, the test package is deleted and its absence
#                 checked.
# Depends on:     .github/workflows/release-image.yml, ops/lib/image.sh, .github/test-image/
# Source:         new in the kit.
name: Release image test

on:
  push:
    tags: ['sk-test-image-*']

permissions:
  contents: read

env:
  # The unsigned image the helper must refuse: the pinned base of the test image.
  UNSIGNED_REFERENCE: docker.io/library/nginx@sha256:65645c7bb6a0661892a8b03b89d0743208a18dd2f3f17a54ef4b76fb8e2f2a10

jobs:
  release:
    uses: ./.github/workflows/release-image.yml
    permissions:
      contents: read
      packages: write
      id-token: write
    with:
      image: ghcr.io/weudlll-cyber/seasonal-kit-test-image
      dockerfile: .github/test-image/Dockerfile
      context: .github/test-image
      platforms: linux/amd64
      version: ${{ github.ref_name }}

  verify:
    needs: release
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      packages: read
    env:
      REFERENCE: ${{ needs.release.outputs.reference }}
      # This run signs at a test tag, which the default signer rightly refuses.
      TEST_SIGNER: ^https://github\.com/weudlll-cyber/seasonal-kit/\.github/workflows/release-image\.yml@refs/tags/sk-test-image-
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      # Everything below verifies with the cosign a game installs, not the action's.
      - name: The pinned cosign installs, by its checksum
        run: |
          source ops/lib/image.sh
          SK_COSIGN_DIR="$RUNNER_TEMP/cosign" sk_cosign_install
          echo "$RUNNER_TEMP/cosign" >>"$GITHUB_PATH"
      - name: The helper passes the signed image and refuses every other case
        run: |
          source ops/lib/image.sh
          [ "$(command -v cosign)" = "$RUNNER_TEMP/cosign/cosign" ]
          cosign version 2>&1 | grep -F "v$SK_COSIGN_VERSION"
          export SK_IMAGE_REPOSITORY="$GITHUB_REPOSITORY"
          refuse() { if "$@"; then echo "::error::passed, and must not: $*"; exit 1; fi; }
          passed=$(SK_IMAGE_SIGNER="$TEST_SIGNER" sk_image_verify "$REFERENCE")
          [ "$passed" = "$REFERENCE" ]
          # By its tag too: the helper looks the digest up.
          passed=$(SK_IMAGE_SIGNER="$TEST_SIGNER" sk_image_verify "${REFERENCE%@*}:$GITHUB_REF_NAME")
          [ "$passed" = "$REFERENCE" ]
          refuse sk_image_verify "$REFERENCE"
          SK_IMAGE_REPOSITORY=weudlll-cyber/seasonal-mini-games SK_IMAGE_SIGNER="$TEST_SIGNER" \
            refuse sk_image_verify "$REFERENCE"
          SK_IMAGE_SIGNER="$TEST_SIGNER" refuse sk_image_verify "$UNSIGNED_REFERENCE"
          # The source commit: this run's passes, another is refused.
          passed=$(SK_IMAGE_COMMIT="$GITHUB_SHA" SK_IMAGE_SIGNER="$TEST_SIGNER" sk_image_verify "$REFERENCE")
          [ "$passed" = "$REFERENCE" ]
          SK_IMAGE_COMMIT=0000000000000000000000000000000000000000 SK_IMAGE_SIGNER="$TEST_SIGNER" \
            refuse sk_image_verify "$REFERENCE"
      - name: The SBOM's attestation verifies
        run: |
          cosign verify-attestation --type cyclonedx \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com \
            --certificate-identity-regexp "$TEST_SIGNER" \
            --certificate-github-workflow-repository "$GITHUB_REPOSITORY" \
            "$REFERENCE" >/dev/null

  cleanup:
    needs: [release, verify]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      packages: write # delete the test package this workflow made
    steps:
      - name: Remove the test package
        env:
          GH_TOKEN: ${{ github.token }}
          PACKAGE: /users/weudlll-cyber/packages/container/seasonal-kit-test-image
        run: |
          gh api -X DELETE "$PACKAGE"
          if gh api "$PACKAGE" >/dev/null 2>&1; then
            echo "::error::the test package is still there"
            exit 1
          fi
