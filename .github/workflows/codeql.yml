# @file   .github/workflows/codeql.yml
# @brief  CodeQL code scanning for JavaScript and TypeScript.
#
# Responsibility: static security analysis on every PR to master, on master and weekly, so new
#                 queries also run against unchanged code (seasonal-mini-games
#                 .github/workflows/codeql.yml at 93ed780, unchanged but for this header). A
#                 required check of master's branch protection.
name: CodeQL

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  schedule:
    # Mondays 04:23 UTC.
    - cron: '23 4 * * 1'

permissions:
  security-events: write
  contents: read

jobs:
  analyze:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: github/codeql-action/init@6f2ac81f5cd81fe351a197ba0b00d91d03cd2aee # v4.39.0
        with:
          languages: javascript-typescript
          # TypeScript is analysed from source; no build needed.
          build-mode: none
      - uses: github/codeql-action/analyze@6f2ac81f5cd81fe351a197ba0b00d91d03cd2aee # v4.39.0
