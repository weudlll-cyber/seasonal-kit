# @file   pnpm-workspace.yaml
# @brief  pnpm's settings for the kit (one package, no workspace members).
#
# Responsibility: the install rules of the games (seasonal-mini-games pnpm-workspace.yaml at
#                 93ed780), stricter: no install script runs at all, the kit's own included
#                 (Mini Games allows lefthook's). pnpm 11+ reads its settings here, not from
#                 .npmrc.

# Refuse installs on a Node version outside package.json "engines".
engineStrict: true
# "pnpm add" pins exact versions; upgrades arrive as Renovate PRs.
saveExact: true
# No lifecycle script of any package runs on install (docs/DELIVERY.md: the kit needs none, so
# no game has to allow one). The git hook is installed by hand: CONTRIBUTING.md.
ignoreScripts: true

# Forced versions for transitive dependencies. Remove an entry once its parent ships the fix.
overrides:
  # typescript-eslint 8.71.2 pins minimatch 10.2.6 (GHSA-g3hv-75wg-m249, ReDoS in glob
  # patterns; osv-scanner 2026-11-20); 11.0.9 is the fixed line ESLint itself already uses.
  minimatch@10.2.6: 11.0.9
