# @file   .github/workflows/release-image.yml
# @brief  A project's release image: built on a tag, pushed to GitHub's container registry with an
#         SBOM, and signed without any key (K109).
#
# Responsibility: a reusable workflow (`on: workflow_call`), run only for a tag. It builds the
#                 caller's image, pushes it to `image` (default ghcr.io/<owner>/<repository>) as
#                 the tag's version, writes a CycloneDX SBOM of it, and signs the image and
#                 attests the SBOM with cosign keyless: GitHub's OIDC token proves the run, so no
#                 key exists or is stored. The signing identity is this workflow, with the
#                 caller's repository in the certificate; ops/lib/image.sh checks both. The
#                 package's visibility is the registry package's own setting (public or private,
#                 one setting, not set here). The job summary says how to verify. Signatures are
#                 recorded in Sigstore's public transparency log, repository name included. The
#                 caller grants `packages: write` and `id-token: write` (docs/OPERATIONS.md).
# Depends on:     the caller's Dockerfile
# Source:         seasonal-bingo-royale .github/workflows/release.yml at d7d841e (the build, the
#                 actions' pins, the SBOM; its signing, prepared and off at line 78, is on here).
#                 Left in the game: the check that the tag is on master with a green run, and the
#                 GitHub release.
name: Release image

on:
  workflow_call:
    inputs:
      image:
        description: The registry name; empty is ghcr.io/<owner>/<repository>.
        default: ''
        type: string
      dockerfile:
        default: Dockerfile
        type: string
      context:
        default: .
        type: string
      build-args:
        description: The build's arguments, one NAME=value a line; never a secret.
        default: ''
        type: string
      platforms:
        default: linux/amd64,linux/arm64
        type: string
      version:
        description: The image's tag; empty is the git tag without its "v".
        default: ''
        type: string
    outputs:
      reference:
        description: The signed image, as name@digest.
        value: ${{ jobs.release.outputs.reference }}

permissions:
  contents: read

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
      packages: write # push to the container registry
      id-token: write # the keyless signature's proof of this run
    outputs:
      reference: ${{ steps.done.outputs.reference }}
    env:
      GIVEN_IMAGE: ${{ inputs.image }}
      GIVEN_VERSION: ${{ inputs.version }}
    steps:
      - name: Only a tag releases
        run: |
          if [ "$GITHUB_REF_TYPE" != tag ]; then
            echo "::error::a release image is built on a tag, not on $GITHUB_REF_TYPE"
            exit 1
          fi
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: The image's name and version
        run: |
          # The registry takes lower case only.
          name=${GIVEN_IMAGE:-ghcr.io/$GITHUB_REPOSITORY}
          version=${GIVEN_VERSION:-${GITHUB_REF_NAME#v}}
          [[ $version =~ ^[A-Za-z0-9_][A-Za-z0-9_.-]{0,127}$ ]] ||
            { echo "::error::$version is no image tag"; exit 1; }
          echo "IMAGE=${name,,}" >>"$GITHUB_ENV"
          echo "VERSION=$version" >>"$GITHUB_ENV"
      # QEMU lets the amd64 runner build the other architectures.
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: ${{ inputs.context }}
          file: ${{ inputs.dockerfile }}
          build-args: ${{ inputs.build-args }}
          platforms: ${{ inputs.platforms }}
          push: true
          tags: ${{ env.IMAGE }}:${{ env.VERSION }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ env.VERSION }}
      - name: CycloneDX SBOM of the pushed image
        uses: anchore/sbom-action@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
        with:
          image: ${{ env.IMAGE }}@${{ steps.build.outputs.digest }}
          format: cyclonedx-json
          output-file: sbom.cdx.json
          upload-artifact: false
          upload-release-assets: false
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
      - id: done
        name: Sign the image and its SBOM (keyless)
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          cosign sign --yes "$IMAGE@$DIGEST"
          cosign attest --yes --type cyclonedx --predicate sbom.cdx.json "$IMAGE@$DIGEST"
          echo "reference=$IMAGE@$DIGEST" >>"$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: sbom
          path: sbom.cdx.json
      - name: How to verify
        env:
          REFERENCE: ${{ steps.done.outputs.reference }}
        run: |
          {
            echo "## Signed release image"
            echo
            echo "\`$IMAGE:$VERSION\` is \`$REFERENCE\`. Who may pull it is the registry package's"
            echo "visibility setting."
            echo
            echo 'Verify on a server (`sk_cosign_install` installs cosign):'
            echo
            echo '```sh'
            echo "source node_modules/@seasonal/kit/ops/lib/image.sh"
            echo "SK_IMAGE_REPOSITORY=$GITHUB_REPOSITORY SK_IMAGE_COMMIT=$GITHUB_SHA sk_image_verify $IMAGE:$VERSION"
            echo '```'
            echo
            echo 'The SBOM, from the same signer: `cosign verify-attestation --type cyclonedx` with'
            echo 'the same identity options.'
          } >>"$GITHUB_STEP_SUMMARY"
